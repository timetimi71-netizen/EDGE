name: MT5 Probe
on:
  push:
    branches: [mt5-probe]
permissions:
  contents: write
jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: MT5 installieren
        shell: pwsh
        run: |
          $t0 = Get-Date
          Invoke-WebRequest -Uri https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe -OutFile mt5setup.exe
          Start-Process -FilePath .\mt5setup.exe -ArgumentList '/auto' -Wait
          "install seconds: $(((Get-Date) - $t0).TotalSeconds)"
          Get-ChildItem 'C:\Program Files\MetaTrader 5' | Select-Object -First 20
      - run: pip install MetaTrader5
      - name: Probe
        run: python sync/probe.py
      - name: Status veröffentlichen
        if: always()
        shell: bash
        run: |
          [ -f status.json ] || echo '{"probe":"no status"}' > status.json
          git config user.name "edge-sync"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan probe-out
          git rm -rf --cached . > /dev/null
          git add -f status.json
          git commit -qm "probe status"
          git push -f origin HEAD:mt5-status
